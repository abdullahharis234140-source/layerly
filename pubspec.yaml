name: layerly
description: Layerly - Text Behind Image Studio
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  in_app_purchase: ^3.2.0
  google_mlkit_subject_segmentation: ^0.0.1
  image_picker: ^1.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  share_plus: ^10.0.2
  gal: ^2.3.0
  path_provider: ^2.1.4
  provider: ^6.1.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
